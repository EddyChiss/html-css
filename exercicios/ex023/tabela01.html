<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <style>
        body{
            font: normal normal 1em monospace;
        }

        table{
            border-collapse: collapse;
            height: 400px;
            width: 400px;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: right;
            vertical-align: bottom; /*Alinhamento vertical*/
        }
    </style>
    <title>Tabelas em HTML</title>
</head>
<body>
    <h1>Tabela 01</h1>
    
    <table>
        <caption>Tabela simples em HTML e CSS3</caption>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
    
</body>
</html>
