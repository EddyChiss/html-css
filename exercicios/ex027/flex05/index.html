<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box module</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main{
            background-color: azure;
            height: 100vh;
            width: 100vw;
        }

        article{
            background-color: bisque;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            width: 80vw;
        }
        
        section{
            background-color: tomato;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
   <main>
    <article>
        <section>

        </section>
    </article>
   </main>
</body>
</html>
