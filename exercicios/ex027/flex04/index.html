<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        #conteiner{
            align-items: flex-end;
            background-color: turquoise;
            display: flex;
            flex-flow: row nowrap;
            height: 90px;
            justify-content: space-around;
        }

        .class{
            background-color: teal;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            width: 40px;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="class">01</div>
        <div class="class">02</div>
        <div class="class">03</div>
        <div class="class">04</div>
        <div class="class">05</div>
        <div class="class">06</div>
        <div class="class">07</div>
        <div class="class">08</div>
    </div>
</body>
</html>
