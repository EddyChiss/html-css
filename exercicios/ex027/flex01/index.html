<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div#b{
            background-color: rgb(255, 200, 0);
            display: flex;}
        div.cx{
            background-color: rgb(255, 0, 0);
            border: 1px solid rgb(7, 7, 7);
            color:white;
            flex: auto;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="b">
        <div class="cx">1</div>
        <div class="cx">2</div>
        <div class="cx">3</div>
        <div class="cx">4</div>
        <div class="cx">5</div>
        <div class="cx">6</div>
        <div class="cx">7</div>
        <div class="cx">8</div>
    </div>
</body>
</html>
