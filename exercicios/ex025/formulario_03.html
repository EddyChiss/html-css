<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIOS</title>

</head>
<body style="font-family: monospace;">
    <form>
        <fieldset>
            <legend>Gênero</legend>
            <label for="masculino">
                <p>
                    Masculino
                    <input type="radio" name="sexo" id="masculino">
                </p>
            </label>
            <label for="femenino">
                <p>
                    Femenino
                    <input type="radio" name="sexo" id="femenino">
                </p>
            </label>
        </fieldset>
        <fieldset>
            <legend>Disciplina</legend>
            <label for="fis">
                <p>
                    <input type="checkbox" name="fis" id="fis">
                    Física
                </p>
            </label>
            <label for="qmc">
                <p>
                    <input type="checkbox" name="qmc" id="qmc">
                    Química
                </p>
            </label>
            <label for="bio">
                <p>
                    <input type="checkbox" name="bio" id="bio">
                    Biologia
                </p>
            </label>
            <label for="pt">
                <p>
                    <input type="checkbox" name="pt" id="pt">
                    Português
                </p>
            </label>
            <label for="mat">
                <p>
                    <input type="checkbox" name="mat" id="mat">
                    Matemática
                </p>
            </label>
        </fieldset>
        <input type="submit" value="enviar">
    </form>
</body>
</html>
