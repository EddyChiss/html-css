<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO</title>
</head>
<body>
    <h1>Exemplo de formulário 2</h1>
    <h2>number, data, time, </h2>
    <form action="form.php" method="post">
        <fieldset>
            <legend>Dados pessoais</legend>
            <label for="data">
                <p>
                    Data de Nascimento:
                    <input type="date" name="data" id="data" autocomplete="bday" min="1926-08-19" max="2026-08-19" required>
                </p>
            </label>
            <label for="mes">
                <p>
                    MÊS:
                    <input type="month" name="mes" id="mes">
                </p>
            </label>
            <label for="numero">
                <p>
                    Número:
                    <input type="number" name="numero" id="numero" min="0" max="100" required step="0.1">
                </p>
            </label>
            <label for="hora">
                <p>
                    Hora:
                    <input type="time" name="hora" id="hora" step="1" required >
                </p>
            </label>
            <input type="submit" value="enviar">
        </fieldset>
    </form>
</body>
</html>
