<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <title>Tela de Login</title>
</head>
<body>
    <main>
        <article id="imagem">
    
        </article>
        <article id="normal">
            <h1>
                Login
            </h1>
            <p>
                Olá seja bem-vindo(a) novamente. faça login para acessar à sua conta e poder fazer as configurações.
            </p>
            <form action="">

                <div class="campo">
                    <label class="icon" for="nome"><img src="icon/mail_51dp_75FBFD_FILL0_wght400_GRAD0_opsz48.png" alt=""></label>
                    <input type="text" class="entrada" name="nome" id="nome">
                </div>

                <div class="campo">
                    <label class="icon" for="senha"><img src="icon/key_51dp_75FBFD_FILL0_wght400_GRAD0_opsz48.svg" alt=""></label>
                    <input type="password" class="entrada" name="senha" id="senha">
                </div>

                <div>
                    <label for="esenha">Mostrar senha</label>
                    <input type="checkbox" name="esenha" id="esenha">
                </div>

                <button type="submit">entrar</button>
                <a href="#">Esqueci senha</a>
            </form>
        </article>
    </main>
</body>
</html>
