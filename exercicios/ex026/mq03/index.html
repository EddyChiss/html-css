<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX3 mq</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100vw;
            background: #061223 no-repeat center center;
        }

        @media screen and (orientation: landscape) {
            body{
                background-image: url("../mq02/imagens/paisagem.png");
                background-size: contain;
            }
        }
        @media screen and (orientation: portrait) {
            body{
                background-image: url("../mq02/imagens/retrato.png");
                background-size: contain;
            }
        }
    </style>
</head>
<body>
    <h1>Orientação do dispositivo "MUDE"!</h1>
</body>
</html>
