<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site do clicou</title>
</head>
<body>
    <input type="button" value="Clique em mim" onclick="clicou()">
    <p id="a"></p>
    <script>

        function clicou(){
            var c = document.querySelector("#a");
            c.innerHTML += '<p> Você clicou!</p>';
        }
    </script>
</body>
</html>
